[project]
name = "spotify-unwrapped-backend"
version = "0.1.0"
description = "A more fun spotify wrapped experience"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.124.0",
    "polars>=1.36.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.9",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "adbc-driver-postgresql>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
